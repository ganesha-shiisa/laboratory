<!--
  セル・オートマトン

  参考文献 / 参考書籍:
  『数学から創るジェネラティブアート ― Processingで学ぶかたちのデザイン』
  著者: 巴山竜来 (技術評論社)
  URL: https://gihyo.jp/book/2019/978-4-297-10463-4
-->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>セル・オートマトン</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Consolas",
          monospace, sans-serif;
        background-color: #050505;
        color: #dcdcdc;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      #canvas-container {
        flex: 1;
        width: 100%;
        min-height: 0;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #ui-panel {
        background-color: #1e1e22;
        border-top: 1px solid #33333d;
        padding: 12px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
        flex-shrink: 0;
        max-height: 48vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* --- Slider --- */
      .slider-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 8px 24px;
      }

      .ui-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .ui-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-family: "Consolas", monospace;
      }

      .ui-val {
        color: #70b0ff;
        font-weight: 600;
      }

      .ui-slider-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      .step-btn {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        background: #2a2a32;
        border: 1px solid #4a4a58;
        color: #dcdcdc;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        font-family: monospace;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.05s;
      }

      .step-btn:hover {
        background: #383844;
        border-color: #70b0ff;
      }

      .step-btn:active {
        transform: scale(0.92);
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: #3c3c44;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #e0e0e0;
        border: 2px solid #1e1e22;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #e0e0e0;
        border: 2px solid #1e1e22;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      /* --- Mode buttons --- */
      .mode-container {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .mode-label {
        font-size: 12px;
        color: #9ca3af;
        margin-right: 4px;
        font-family: inherit;
      }

      .mode-btn {
        background: #282830;
        border: 1px solid #424250;
        color: #c0c0c8;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 11.5px;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }

      .mode-btn:hover {
        background: #373744;
        border-color: #5b5b6e;
        color: #ffffff;
      }

      .mode-btn.active {
        background: #1e3a8a;
        border-color: #3b82f6;
        color: #ffffff;
        font-weight: 500;
      }

      /* --- Color palettes --- */
      .palettes-row {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
        padding-top: 2px;
      }

      .palette-group {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-family: inherit;
      }

      .palette-options {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .color-swatch {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid #4a4a58;
        box-sizing: border-box;
        transition:
          transform 0.1s ease,
          border-color 0.1s ease;
      }

      .color-swatch:hover {
        transform: scale(1.15);
      }

      .color-swatch.selected {
        border: 2px solid #ffffff;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        transform: scale(1.15);
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div id="ui-panel">
      <div class="ui-row">
        <div class="ui-header-row">
          <span>NUM</span>
          <span class="ui-val" id="val-num">100</span>
        </div>
        <div class="ui-slider-wrapper">
          <button class="step-btn" id="btn-num-dec">&lt;</button>
          <input
            type="range"
            id="slider-num"
            min="2"
            max="200"
            step="1"
            value="101"
          />
          <button class="step-btn" id="btn-num-inc">&gt;</button>
        </div>
      </div>

      <div class="ui-row">
        <div class="ui-header-row">
          <span>MOD</span>
          <span class="ui-val" id="val-mod">10</span>
        </div>
        <div class="ui-slider-wrapper">
          <button class="step-btn" id="btn-mod-dec">&lt;</button>
          <input
            type="range"
            id="slider-mod"
            min="2"
            max="40"
            step="1"
            value="10"
          />
          <button class="step-btn" id="btn-mod-inc">&gt;</button>
        </div>
      </div>

      <!-- カラーパレット -->
      <div class="palettes-row">
        <div class="palette-group">
          <span>BG Color:</span>
          <div class="palette-options" id="palette-bg"></div>
        </div>
        <div class="palette-group">
          <span>Element Color:</span>
          <div class="palette-options" id="palette-element"></div>
        </div>
      </div>
    </div>

    <script>
      // =========================================================
      //  State
      // =========================================================
      let num = 101;
      let mod = 4;
      let mode = 0; // 0: Addition, 1: Multiplication, 2: Power

      const bgColorOptions = [
        "#050505",
        "#0B0F19",
        "#1A0B2E",
        "#1E222A",
        "#000000",
      ];
      const elementColorOptions = [
        "#00F0FF",
        "#FF2A6D",
        "#FF9E00",
        "#A0E7E5",
        "#E5C158",
      ];
      let bgColor = bgColorOptions[1];
      let elementColor = elementColorOptions[4];

      // =========================================================
      //  Canvas setup
      // =========================================================
      const canvas = document.getElementById("mainCanvas");
      const ctx = canvas.getContext("2d");
      const container = document.getElementById("canvas-container");

      function resizeCanvas() {
        const w = container.clientWidth;
        const h = container.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redraw();
      }

      window.addEventListener("resize", resizeCanvas);

      // =========================================================
      //  Core Logic (ported from Python)
      // =========================================================
      class CellularAutomaton {
        /**
         * セル・オートマトン
         * @param {number} num - グリッドの一辺のサイズ
         * @param {number} mod - 剰余（モジュロ）
         */
        constructor(num, mod) {
          this.num = num;
          this.mod = mod;

          // num × num の2次元配列を 0 で初期化
          this.cells = Array.from({ length: num }, () => Array(num).fill(0));

          // 中央のセルを 1 に設定（JavaScriptの割り算は小数点が出るため Math.floor を使用）
          const center = Math.floor(num / 2);
          this.cells[center][center] = 1;
        }

        /**
         * 状態を1ステップ更新する
         * @returns {number[][]} 更新後の2次元配列
         */
        update_state() {
          const nextCells = Array.from({ length: this.num }, () =>
            Array(this.num).fill(0),
          );

          for (let i = 0; i < this.num; i++) {
            for (let j = 0; j < this.num; j++) {
              nextCells[i][j] = this.transition(i, j);
            }
          }

          this.cells = nextCells;
          return nextCells;
        }

        /**
         * 各セルの遷移ルールを計算する
         * @param {number} i - 行インデックス
         * @param {number} j - 列インデックス
         * @returns {number} 計算後の値
         */
        transition(i, j) {
          // 自身 ＋ 上下左右のオフセット
          const offsets = [
            [0, 0],
            [-1, 0],
            [1, 0],
            [0, -1],
            [0, 1],
          ];

          // Pythonの sum() とジェネレータ式を JavaScript の reduce() で再現
          const total = offsets.reduce((sum, [di, dj]) => {
            // JavaScriptの剰余は負になることがあるため、+ this.num を足して安全にラップアラウンドさせる
            const ni = (i + di + this.num) % this.num;
            const nj = (j + dj + this.num) % this.num;
            return sum + this.cells[ni][nj];
          }, 0);

          return total % this.mod;
        }
      }

      let ca = new CellularAutomaton(num, mod);

      function drawCells(ctx, cells, mod, center, width, color) {
        const rows = cells.length;
        const cols = rows > 0 ? cells[0].length : 0;

        if (rows === 0 || cols === 0) {
          return;
        }

        const cellSize = width / Math.max(rows, cols);

        // 描画の基準となる左上のオフセットを計算
        const startX = center[0] - Math.floor(width / 2);
        const startY = center[1] - Math.floor(width / 2);

        // 描画スタイルの設定
        ctx.fillStyle = color;

        for (let i = 0; i < rows; i++) {
          for (let j = 0; j < cols; j++) {
            const val = cells[i][j];
            // 値が0以下なら描画をスキップしてパフォーマンスを稼ぐ！
            if (val <= 0) {
              continue;
            }

            const x = Math.floor(startX + cellSize / 2 + j * cellSize);
            const y = Math.floor(startY + cellSize / 2 + i * cellSize);
            const radius = Math.floor((val * cellSize) / mod / 2);

            if (radius > 0) {
              ctx.beginPath();
              // arc(x, y, radius, startAngle, endAngle)
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      // =========================================================
      //  Redraw
      // =========================================================
      function redraw() {
        const w = container.clientWidth;
        const h = container.clientHeight;

        // Background
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);

        // Table
        ca.update_state();
        const drawWidth = Math.min(w, h) * 0.9;
        drawCells(ctx, ca.cells, mod, [w / 2, h / 2], drawWidth, elementColor);
      }

      // =========================================================
      //  UI: NUM slider
      // =========================================================
      const sliderNum = document.getElementById("slider-num");
      const valNum = document.getElementById("val-num");

      function setNum(v) {
        v = Math.max(2, Math.min(200, Math.round(v)));
        num = v;
        sliderNum.value = v;
        valNum.textContent = v;
        ca = new CellularAutomaton(num, mod);
        redraw();
      }

      sliderNum.addEventListener("input", () =>
        setNum(Number(sliderNum.value)),
      );
      document
        .getElementById("btn-num-dec")
        .addEventListener("click", () => setNum(num - 1));
      document
        .getElementById("btn-num-inc")
        .addEventListener("click", () => setNum(num + 1));

      // =========================================================
      //  UI: MOD slider
      // =========================================================
      const sliderMod = document.getElementById("slider-mod");
      const valMod = document.getElementById("val-mod");

      function setMod(v) {
        v = Math.max(2, Math.min(40, Math.round(v)));
        mod = v;
        sliderMod.value = v;
        valMod.textContent = v;
        ca = new CellularAutomaton(num, mod);
        redraw();
      }

      sliderMod.addEventListener("input", () =>
        setMod(Number(sliderMod.value)),
      );
      document
        .getElementById("btn-mod-dec")
        .addEventListener("click", () => setMod(mod - 1));
      document
        .getElementById("btn-mod-inc")
        .addEventListener("click", () => setMod(mod + 1));

      // =========================================================
      //  UI: Color palettes
      // =========================================================
      function buildPalette(containerId, colors, selectedIdx, onChange) {
        const container = document.getElementById(containerId);
        colors.forEach((hex, i) => {
          const swatch = document.createElement("div");
          swatch.className =
            "color-swatch" + (i === selectedIdx ? " selected" : "");
          swatch.style.backgroundColor = hex;
          swatch.addEventListener("click", () => {
            container
              .querySelectorAll(".color-swatch")
              .forEach((s) => s.classList.remove("selected"));
            swatch.classList.add("selected");
            onChange(hex);
          });
          container.appendChild(swatch);
        });
      }

      buildPalette("palette-bg", bgColorOptions, 1, (c) => {
        bgColor = c;
        redraw();
      });

      buildPalette("palette-element", elementColorOptions, 4, (c) => {
        elementColor = c;
        redraw();
      });

      // =========================================================
      //  Initial draw
      // =========================================================
      resizeCanvas();

      // =========================================================
      //  Animation Loop
      // =========================================================
      const animIntervalMs = 300;
      lastAnimTime = performance.now();
      function animationLoop(timestamp) {
        if (timestamp - lastAnimTime >= animIntervalMs) {
          lastAnimTime = timestamp;
          redraw();
        }
        requestAnimationFrame(animationLoop);
      }
      requestAnimationFrame(animationLoop);
    </script>
  </body>
</html>
